[package]
name = "somars"
version = "1.1.1"
edition = "2024"
description = "Terminal UI player for SomaFM internet radio"
license = "MIT"
repository = "https://codeberg.org/sgtnasty/somars"
authors = ["Ronaldo Nascimento <sgtnasty@gmail.com>",
    "Claude <noreply@anthropic.com>"]

[[bin]]
name = "somars"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
